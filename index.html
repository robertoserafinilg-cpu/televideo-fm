<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TELEVIDEO FM</title><style>body{background:#050505;color:#fff;font:18px monospace;max-width:900px;margin:auto;padding:16px}h1{color:#ffeb00}h2{color:#0ff}button,input{font:inherit;background:#161616;color:#fff;border:1px solid #0ff;padding:10px;margin:4px}button{cursor:pointer}a{color:#fff;text-decoration:none}a:hover{text-decoration:underline}article{border-bottom:1px solid #444;padding:14px 0}small{color:#8f8}#status{color:#ffeb00}nav{display:flex;flex-wrap:wrap}footer{color:#aaa}</style><h1>▉ TELEVIDEO FM</h1><p>OSSERVATORIO MULTISERVIZI E IGIENE AMBIENTALE</p><div id="clock"></div><nav id="nav"></nav><input id="num" type="number" placeholder="N. pagina" min="100" max="999"><button id="go">VAI</button><h2 id="heading"></h2><p id="status" role="status">Caricamento…</p><main id="news"></main><footer>Rassegna automatica RSS: titoli e fonti esterne, non verificati redazionalmente. Non è un servizio RAI.</footer><script>const pages={100:"Ultim’ora",110:"Multiservizi",120:"Igiene ambientale",201:"Cosp Tecno Service",202:"Rekeep",203:"Dussmann",204:"Coopservice",205:"Idealservice",206:"Markas",207:"Euro&Promos",208:"Miorelli",209:"CNS",300:"Gare e aggiudicazioni",310:"Cambi appalto",410:"Accordi sindacali",420:"Scioperi e vertenze",430:"CCNL",500:"Normativa e giurisprudenza",600:"Bilanci",610:"Rating legalità",620:"Sanzioni",700:"Umbria e Centro Italia"};let data={},page=100;const el=id=>document.getElementById(id);for(const [n,t] of Object.entries(pages)){const b=document.createElement("button");b.textContent=n+" "+t;b.onclick=()=>show(+n);el("nav").append(b)}function show(n){if(!pages[n])return;page=n;el("heading").textContent=n+" • "+pages[n];el("num").value=n;el("news").replaceChildren();const items=data.pages?.[n]||[];for(const item of items){const a=document.createElement("article"),link=document.createElement("a"),s=document.createElement("small");link.textContent=item.title;try{const u=new URL(item.url);if(["https:","http:"].includes(u.protocol))link.href=u.href}catch{}link.target="_blank";link.rel="noopener noreferrer";s.textContent=item.source+" • "+item.date;a.append(link,document.createElement("br"),s);el("news").append(a)}if(!items.length)el("news").textContent="Nessuna notizia disponibile per questa pagina."}async function load(){try{const r=await fetch("news.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error();data=await r.json();el("status").textContent=data.updated?"Ultimo aggiornamento: "+new Date(data.updated).toLocaleString("it-IT"):"In attesa della prima raccolta";show(page)}catch{el("status").textContent="Dati non disponibili. Nuovo tentativo tra 5 minuti."}}el("go").onclick=()=>show(+el("num").value);setInterval(()=>el("clock").textContent=new Date().toLocaleString("it-IT"),1000);show(100);load();setInterval(load,300000)</script></html>
